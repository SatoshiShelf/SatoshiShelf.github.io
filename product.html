<body>

    <nav class="site"><a href="p/">All products</a></nav>

</header>

<div class="wrap">
  <div class="crumbs"><a href="index.html">Home</a> &nbsp;/&nbsp; <a href="p/">Products</a> &nbsp;/&nbsp; <span id="crumb"></span></div>
  <div class="product-layout">
    <div class="product-head" id="head"></div>
    <aside class="buybox" id="buybox"></aside>
  </div>
  <section class="section" id="related" style="padding-top:0">
    <div class="section-head" style="margin-bottom:26px"><span class="kicker">Keep going</span><h2 style="font-size:24px">You might also like</h2></div>
    <div class="related" id="relatedGrid"></div>
  </section>
</div>

<footer class="site">
  <div class="wrap">
    <div class="fine" style="border-top:none;margin-top:0;padding-top:0">
      &copy; <span id="year"></span> Satoshi Shelf &middot; <a href="p/">All products</a> &middot; <a href="policies.html">Policies</a> &middot; Lightning payments &middot; On-chain fallback &middot; All sales final
    </div>
  </div>
</footer>

<div class="modal" id="previewModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-label="Product preview">
    <div class="modal-bar">
      <span class="modal-title"><span class="live"></span> Free one-time preview &middot; 12 seconds</span>
      <button class="modal-x" data-close aria-label="Close preview">&times;</button>
    </div>
    <iframe id="previewFrame" title="Product preview" src="about:blank"></iframe>
  </div>
</div>

<script src="assets/products.js"></script>
<script src="assets/runinfo.js"></script>
<script src="assets/app.js"></script>
<script src="assets/qrcode.js"></script>
<script>
const { fmtUsd, fmtSats, usdToBtc, btcUri, renderQR, verifyPayment, workerPurchase, createLightningInvoice, checkLightningInvoice, isSecure, CFG } = window.Shelf;
document.getElementById("year").textContent = new Date().getFullYear();

const id = new URLSearchParams(location.search).get("id");
const p = window.PRODUCTS.find(x => x.id === id) || window.PRODUCTS[0];
document.title = p.name + " — Satoshi Shelf";

// Escape everything that comes from the catalog before it goes into innerHTML.
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = s => encodeURIComponent(String(s == null ? "" : s));
const safeJs = s => JSON.stringify(String(s == null ? "" : s)).replace(/</g, "\\u003c").replace(/>/g, "\\u003e").replace(/&/g, "\\u0026");

function seo(p) {
  const site = location.origin + location.pathname.replace(/[^/]*$/, "");
  const url = site + "p/" + encodeURIComponent(p.id) + ".html";
  const img = site + "assets/covers/" + encodeURIComponent(p.id) + ".jpg";
  const desc = (p.summary || p.tagline || "Digital product, paid in Bitcoin.").slice(0, 300);
  function put(tag, attrs) {
    const key = attrs["data-seo"];
    let el = document.head.querySelector('[data-seo="' + key + '"]');
    if (!el) {
      el = document.createElement(tag);
      el.setAttribute("data-seo", key);
      document.head.appendChild(el);
    }
    Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
  }
  put("link", { "data-seo": "canonical", rel: "canonical", href: url });
  put("meta", { "data-seo": "desc", name: "description", content: desc });
  put("meta", { "data-seo": "og:type", property: "og:type", content: "product" });
  put("meta", { "data-seo": "og:title", property: "og:title", content: p.name + " \u2014 Satoshi Shelf" });
  put("meta", { "data-seo": "og:desc", property: "og:description", content: desc });
  put("meta", { "data-seo": "og:url", property: "og:url", content: url });
  put("meta", { "data-seo": "og:image", property: "og:image", content: img });
  put("meta", { "data-seo": "og:image:alt", property: "og:image:alt", content: p.name + " \u2014 " + p.tagline });
  put("meta", { "data-seo": "tw:title", name: "twitter:title", content: p.name + " \u2014 Satoshi Shelf" });
  put("meta", { "data-seo": "tw:desc", name: "twitter:description", content: desc });
  put("meta", { "data-seo": "tw:image", name: "twitter:image", content: img });
  put("meta", { "data-seo": "tw:image:alt", name: "twitter:image:alt", content: p.name + " \u2014 " + p.tagline });
  const s = document.createElement("script");
  s.type = "application/ld+json";
  const jsonLd = JSON.stringify({
    "@context": "https://schema.org",
    "@type": "Product",
    "name": p.name,
    "description": desc,
    "image": img,
    "brand": { "@type": "Brand", "name": "Satoshi Shelf" },
    "offers": {
      "@type": "Offer",
      "url": url,
      "priceCurrency": "USD",
      "price": p.priceUsd,
      "availability": "https://schema.org/InStock"
    }
  });
  // Neutralise the sequence that can close the <script> element from inside JSON.
  s.textContent = jsonLd.replace(/<\//g, "<\\/");
  document.head.appendChild(s);
}
seo(p);
document.getElementById("crumb").innerHTML = `<a id="crumbcat" href="category-${safeUrl(String(p.category || "").toLowerCase())}.html">${esc((p.category || "Products").replace(/-/g, " "))}</a> &nbsp;/&nbsp; ${esc(p.name)}`;

function runBlock(p) {
  const info = (window.RUNINFO || {})[p.id];
  if (!info) return "";
  const script = info.script || "your_script.py";
  const deps = info.deps || [];
  const depText = esc(deps.length ? deps.join(", ") : "none — only the Python standard library");
  const installStep = deps.length
    ? `<li>Install the dependencies: <code class="run-code">pip install -r requirements.txt</code> <span class="muted">(installs ${esc(deps.join(", "))})</span></li>`
    : "";
  return `
    <h2>How to run it</h2>
    <p>This is a Python script bundle. You only need <b>Python 3</b> installed (free from <span class="mono">python.org</span>). External libraries: <b>${depText}</b>.</p>
    <ol class="run-steps">
      <li>Download and <b>unzip</b> the file.</li>
      <li>Open a <b>terminal</b> (Command Prompt on Windows, Terminal on macOS/Linux) and go into the unzipped folder.</li>
      ${installStep}
      <li>Run the script:
        <pre class="run-code">python ${esc(script)}</pre>
      </li>
    </ol>
    <p class="muted">Every bundle includes a <b>README.md</b> with full instructions, options and examples — open it for the exact usage.</p>`;
}

document.getElementById("head").innerHTML = `
  <div class="cover product-cover">
    <img class="cover-img" src="assets/covers/${safeUrl(p.id)}.jpg" alt="${esc(p.name)} preview" onerror="this.style.display='none';this.parentNode.classList.add('noimg')">
    <span class="catbadge">${esc((p.category || "Digital download").replace(/-/g, " "))}</span>
  </div>
  <h1>${esc(p.name)}</h1>
  <p class="tag">${esc(p.tagline)}</p>
  ${p.format ? `<div class="fmtline"><span class="pill">${esc(p.format)}</span></div>` : ""}
  <div class="product-body">
    <h2>What you get</h2>
    <p>${esc(p.summary)}</p>
    <h2>Highlights</h2>
    <ul class="checks">${(p.bullets || []).map(b => `<li>${esc(b)}</li>`).join("")}</ul>
    <h2>Delivery</h2>
    <p>Immediately after your Lightning payment settles, a download link appears right here on this page. The on-chain fallback unlocks after the transaction is seen. No account, no email required — keep the page open until you download.</p>
    <h2>Format</h2>
    <p>${esc(p.format || "Self-contained HTML file")}. ${/\.html$/.test(String(p.file || "")) ? "Open it in any browser, or use your browser's <b>Print &rarr; Save as PDF</b> for an offline copy you own forever." : "Delivered as an instant download after your payment is verified."}</p>
    ${runBlock(p)}
  </div>`;

const related = window.PRODUCTS.filter(x => x.id !== p.id)
  .sort((a, b) => (b.category === p.category) - (a.category === p.category))
  .slice(0, 6);
document.getElementById("relatedGrid").innerHTML = related.map(x => `
  <a class="mini" href="p/${safeUrl(x.id)}.html">
    <span class="g"><img src="assets/covers/${safeUrl(x.id)}.jpg" alt="" loading="lazy" onerror="this.style.display='none'"></span>
    <span><span class="t">${esc(x.name)}</span><br><span class="p">$${esc(x.priceUsd)} &middot; ${esc(x.tagline)}</span></span>
  </a>`).join("");

const box = document.getElementById("buybox");
box.innerHTML = `
  <div class="flowsteps">
    <div class="s active" id="st1">1&nbsp; Pay</div>
    <div class="s" id="st2">2&nbsp; Confirm</div>
    <div class="s" id="st3">3&nbsp; Download</div>
  </div>
  <p class="title">${esc(p.name)}</p>
  <div class="amount">${esc(fmtUsd(p.priceUsd))}</div>
  <div class="sats" id="sats">loading live BTC price&hellip;</div>
  <button class="btn ghost block" id="trialBtn" style="margin-bottom:10px">&#9654;&nbsp; Try it free &mdash; 12-second preview</button>
  <div class="trialhint" id="trialHint"></div>
  <button class="btn block" id="payBtn">Pay with Lightning</button>
  <button class="btn ghost block small" id="onchainBtn" style="margin-top:8px">Prefer on-chain? Pay to a Bitcoin address</button>

  <div class="pay" id="pay">
    <div id="lnPanel">
      <div class="payhead"><span class="pill">Lightning</span><span class="muted">Settles in seconds</span></div>
      <div class="qrbox" id="lnQr"></div>
      <div class="addr addr-invoice" id="lnInvoice" title="Click to copy the Lightning invoice"></div>
      <div class="copy-hint" id="lnHint">Tap the invoice to copy it</div>
      <a class="btn ghost block small" id="lnWallet" style="margin-bottom:16px">Open in Lightning wallet</a>
      <div class="notice" id="lnNote"></div>
      <div class="deliver hidden" id="lnDeliver">
        <h4>&#10004; Payment settled</h4>
        <p class="muted" id="lnDeliverMsg" style="margin:0 0 12px"></p>
        <a class="btn small block" id="lnDl" href="#" download>Download now</a>
      </div>
    </div>

    <details class="onchain" id="onchain">
      <summary>On-chain payment details</summary>
      <div class="onchain-box">
        <div class="qrbox" id="qr"></div>
        <div class="addr" id="addr" title="Click to copy">${esc(CFG.btcAddress)}</div>
        <div class="copy-hint" id="hint">Tap the address to copy it</div>
        <a class="btn ghost block small" id="walletLink" style="margin-bottom:16px">Open in wallet</a>
        <label class="field" for="txid">Paste your transaction ID after paying</label>
        <input class="control" id="txid" placeholder="64-character transaction ID" autocomplete="off" spellcheck="false">
        <button class="btn block" id="verifyBtn" style="margin-top:12px">Verify on-chain payment</button>
        <div class="notice" id="note"></div>
        <div class="deliver hidden" id="deliver">
          <h4>&#10004; Payment verified</h4>
          <p class="muted" id="deliverMsg" style="margin:0 0 12px"></p>
          <a class="btn small block" id="dl" href="#" download>Download now</a>
        </div>
      </div>
    </details>
  </div>

  <div class="guarantee">
    <div>&#9889; Lightning settlement in seconds</div>
    <div>&#128274; No signup &middot; no card &middot; no tracking</div>
    <div>&#8383; On-chain fallback available</div>
  </div>`;

let btcAmt = null;
let ln = { active: false, timer: null, token: null, paymentRequest: "", expiresAt: 0 };

(function trial() {
  const TRIAL_KEY = "shelf_trial_" + p.id;
  const btn = document.getElementById("trialBtn");
  const hint = document.getElementById("trialHint");
  const modal = document.getElementById("previewModal");
  const frame = document.getElementById("previewFrame");
  const used = () => { try { return !!localStorage.getItem(TRIAL_KEY); } catch (e) { return false; } };

  function sync() {
    if (used()) {
      btn.disabled = true;
      btn.innerHTML = "&#10003;&nbsp; Preview used \u2014 unlock the full version";
      hint.textContent = "Your one-time preview was used on this device.";
      hint.classList.add("show");
    }
  }
  function open() {
    if (used()) return;
    frame.src = "previews/" + encodeURIComponent(p.id) + ".html";
    modal.hidden = false;
    document.body.style.overflow = "hidden";
    btn.disabled = true;
    btn.innerHTML = "&#9654;&nbsp; Preview running\u2026";
  }
  function close() {
    modal.hidden = true;
    frame.src = "about:blank";
    document.body.style.overflow = "";
    btn.disabled = false;
    sync();
  }
  sync();
  btn.addEventListener("click", open);
  modal.addEventListener("click", e => { if (e.target.hasAttribute("data-close")) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) close(); });
})();

function noteTo(id, kind, msg) {
  const n = document.getElementById(id);
  if (!n) return;
  n.className = "notice show " + kind;
  n.textContent = msg;
}

function note(kind, msg) { noteTo("note", kind, msg); }

function setStep(step) {
  ["st1", "st2", "st3"].forEach((id, i) => {
    document.getElementById(id).classList.toggle("active", i < step);
  });
}

function safeDownloadUrl(url) {
  const s = String(url || "");
  if (/^https:\/\//i.test(s)) return s;
  if (/^\/[^/]/.test(s)) return s;
  return "";
}

function stopLnPoll() {
  ln.active = false;
  if (ln.timer) { clearTimeout(ln.timer); ln.timer = null; }
}

function showLnInvoice(visible) {
  ["lnQr", "lnInvoice", "lnHint", "lnWallet"].forEach(id => {
    document.getElementById(id).classList.toggle("hidden", !visible);
  });
}

function expiryText() {
  if (!ln.expiresAt) return "";
  const left = Math.max(0, Math.floor(ln.expiresAt - Date.now() / 1000));
  const m = Math.floor(left / 60);
  const s = left % 60;
  return m + ":" + String(s).padStart(2, "0");
}

async function initPrice() {
  try {
    btcAmt = await usdToBtc(p.priceUsd);
    document.getElementById("sats").innerHTML = fmtSats(btcAmt) + " &middot; " + btcAmt.toFixed(8) + " BTC";
  } catch (e) {
    document.getElementById("sats").textContent = "live price unavailable — the invoice still shows the exact amount";
  }
}
initPrice();

async function startLightning() {
  stopLnPoll();
  document.getElementById("pay").classList.add("show");
  document.getElementById("lnPanel").classList.remove("hidden");
  document.getElementById("onchain").open = false;
  document.getElementById("lnDeliver").classList.add("hidden");
  showLnInvoice(false);
  ln.paymentRequest = "";
  ln.expiresAt = 0;
  ln.token = null;
  document.getElementById("lnInvoice").textContent = "";
  document.getElementById("lnQr").innerHTML = "";
  document.getElementById("lnWallet").removeAttribute("href");
  document.getElementById("lnHint").textContent = "Tap the invoice to copy it";
  noteTo("lnNote", "info", "Creating a Lightning invoice…");
  setStep(1);

  const btn = document.getElementById("payBtn");
  btn.disabled = true;
  btn.textContent = "Creating invoice…";

  let res;
  try {
    res = await createLightningInvoice(p.id);
  } catch (e) {
    res = { ok: false, reason: "Error: " + e.message };
  }

  if (!res.ok) {
    showLnInvoice(false);
    noteTo("lnNote", "err", res.reason);
    document.getElementById("onchain").open = true;
    btn.disabled = false;
    btn.textContent = "Try Lightning again";
    return;
  }

  ln.active = true;
  ln.token = res.invoiceToken;
  ln.paymentRequest = res.paymentRequest;
  ln.expiresAt = res.expiresAt || 0;

  showLnInvoice(true);
  const uri = "lightning:" + res.paymentRequest;
  renderQR(document.getElementById("lnQr"), uri);
  const inv = document.getElementById("lnInvoice");
  inv.textContent = res.paymentRequest;
  inv.title = "Click to copy the Lightning invoice";
  document.getElementById("lnWallet").href = uri;

  const amount = res.amountSats ? res.amountSats.toLocaleString() + " sats" : "the amount shown in your wallet";
  noteTo("lnNote", "info", "Scan the QR or open it in a Lightning wallet. Pay " + amount + ". Waiting for settlement…");
  btn.textContent = "Waiting for payment…";
  btn.disabled = true;
  setStep(2);
  pollLightning();
}

async function pollLightning() {
  if (!ln.active) return;
  const res = await checkLightningInvoice(ln.token);
  if (!ln.active) return;

  if (res.ok) {
    stopLnPoll();
    setStep(3);
    showLnInvoice(false);
    noteTo("lnNote", "ok", "Payment settled. Your download is ready.");
    const dl = document.getElementById("lnDl");
    dl.href = safeDownloadUrl(res.downloadUrl) || ("product.html?id=" + safeUrl(p.id));
    dl.setAttribute("download", "");
    document.getElementById("lnDeliverMsg").textContent = res.paidSats
      ? "Paid " + Number(res.paidSats).toLocaleString() + " sats over Lightning. Thanks for supporting a small independent store."
      : "Payment settled. Your secure download link expires in 15 minutes.";
    document.getElementById("lnDeliver").classList.remove("hidden");
    const btn = document.getElementById("payBtn");
    btn.textContent = "Paid \u2713";
    btn.disabled = true;
    document.getElementById("onchainBtn").classList.add("hidden");
    return;
  }

  if (res.expired) {
    stopLnPoll();
    showLnInvoice(false);
    noteTo("lnNote", "err", "Invoice expired. Create a new one to try again.");
    const btn = document.getElementById("payBtn");
    btn.disabled = false;
    btn.textContent = "Create a new invoice";
    return;
  }

  if (res.pending) {
    noteTo("lnNote", "info", "Waiting for payment… " + (expiryText() ? "Invoice expires in " + expiryText() + "." : ""));
  } else if (res.retry) {
    noteTo("lnNote", "info", "Checking again…");
  } else {
    noteTo("lnNote", "err", res.reason);
    if (res.code === "LN_STATUS_UNAVAILABLE") {
      // Keep polling through a temporary provider hiccup.
    } else {
      showLnInvoice(false);
      const btn = document.getElementById("payBtn");
      btn.disabled = false;
      btn.textContent = "Try Lightning again";
      return;
    }
  }

  ln.timer = setTimeout(pollLightning, 2500);
}

document.getElementById("payBtn").addEventListener("click", startLightning);

document.getElementById("onchainBtn").addEventListener("click", () => {
  stopLnPoll();
  document.getElementById("pay").classList.add("show");
  document.getElementById("lnPanel").classList.add("hidden");
  document.getElementById("onchain").open = true;
  setStep(1);
});

document.getElementById("lnInvoice").addEventListener("click", async () => {
  if (!ln.paymentRequest) return;
  const h = document.getElementById("lnHint");
  const old = h.textContent;
  try {
    await navigator.clipboard.writeText(ln.paymentRequest);
    h.textContent = "Invoice copied \u2713";
  } catch {
    h.textContent = "Select and copy manually";
  }
  setTimeout(() => { h.textContent = old; }, 1800);
});

document.getElementById("addr").addEventListener("click", async () => {
  const h = document.getElementById("hint");
  const old = h.textContent;
  try {
    await navigator.clipboard.writeText(CFG.btcAddress);
    h.textContent = "Address copied \u2713";
  } catch {
    h.textContent = "Select and copy manually";
  }
  setTimeout(() => { h.textContent = old; }, 1600);
});

document.getElementById("onchain").addEventListener("toggle", async () => {
  if (!document.getElementById("onchain").open) return;
  if (!btcAmt) await initPrice();
  if (!btcAmt) {
    note("err", "Live price unavailable. Refresh and try again.");
    return;
  }
  const uri = btcUri(CFG.btcAddress, btcAmt, "Satoshi Shelf: " + p.id);
  renderQR(document.getElementById("qr"), uri);
  document.getElementById("walletLink").href = uri;
});

document.getElementById("verifyBtn").addEventListener("click", async () => {
  const btn = document.getElementById("verifyBtn");
  btn.disabled = true; btn.textContent = "Checking…";
  setStep(2);
  try {
    if (!btcAmt) await initPrice();
    let res, url = null;
    if (isSecure()) {
      res = await workerPurchase(p.id, document.getElementById("txid").value);
      url = res.downloadUrl;
    } else {
      res = await verifyPayment(document.getElementById("txid").value, btcAmt || 0.00000001);
    }
    if (!res.ok) {
      note("err", res.reason);
    } else {
      note("info", res.confirmed ? "Confirmed on-chain." : "Seen in mempool — confirmation follows shortly.");
      setStep(3);
      const dl = document.getElementById("dl");
      // Only allow same-origin relative paths or https URLs — never javascript:/data:.
      dl.href = safeDownloadUrl(url) || ("product.html?id=" + safeUrl(p.id));
      dl.setAttribute("download", "");
      document.getElementById("deliverMsg").textContent = res.paidSats
        ? "Paid " + Number(res.paidSats).toLocaleString() + " sats. Thanks for supporting a small independent store."
        : "Payment verified. Your secure download is ready — the link expires in 15 minutes.";
      document.getElementById("deliver").classList.remove("hidden");
    }
  } catch (e) {
    note("err", "Error: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = "Verify on-chain payment";
  }
});
